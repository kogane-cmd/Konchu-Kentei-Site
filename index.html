<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆虫知識検定</title>

<style>

body{
    margin:0;
    background:#fff;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    color:#111;
    user-select:none;
}

header{
    background:#1f3a1f;
    color:#fff;
    padding:20px;
    text-align:center;
}

.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-bottom:15px;
}

button{
    padding:10px 14px;
    border:none;
    background:#1f3a1f;
    color:#fff;
    cursor:pointer;
    border-radius:6px;
    margin:5px 0;
}

button:hover{
    opacity:0.9;
}

.choice{
    display:block;
    width:100%;
    margin:8px 0;
    padding:10px;
    background:#f5f5f5;
    border:1px solid #ccc;
    color:#111;
    cursor:pointer;
    text-align:left;
}

.choice:hover{
    background:#e6e6e6;
}

#quizArea,#resultArea{display:none;}

#topBar{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-bottom:10px;
}

</style>
</head>

<body>

<header>
<h1>昆虫知識検定</h1>
</header>

<div class="container">

<!-- 級選択 -->
<div class="card" id="selectArea">

<h2>受検級を選択</h2>

<p>
・制限時間180秒<br>
・外部検索禁止<br>
・不正行為禁止
</p>

<button onclick="startExam(5)">5級</button>
<button onclick="startExam(4)">4級</button>
<button onclick="startExam(3)">3級</button>
<button onclick="startExam(2)">2級</button>
<button onclick="startExam(1)">1級</button>

</div>

<!-- 試験 -->
<div class="card" id="quizArea">

<div id="topBar">
<div id="progress"></div>
<div id="timer"></div>
</div>

<hr>

<h2 id="question"></h2>
<div id="choices"></div>

<button onclick="backQuestion()">戻る</button>

</div>

<!-- 結果 -->
<div class="card" id="resultArea">

<h2>結果</h2>

<h1 id="resultText"></h1>

<p id="detailText"></p>

<p id="timeText"></p>

<button onclick="location.reload()">終了</button>

</div>

</div>

<script>

const questionBank = {

5:[
{q:"昆虫の足の本数は？",a:["4本","6本","8本","10本"],c:1},
{q:"カブトムシの主な食べ物は？",a:["樹液","草","水","石"],c:0},
{q:"昆虫の体構造は？",a:["頭・胸・腹","頭・胴・脚","胸・腹・羽","頭・尻"],c:0},
{q:"チョウの幼虫は？",a:["イモムシ","ミミズ","ヤゴ","カエル"],c:0},
{q:"バッタが多い季節は？",a:["冬","春〜秋","真冬","雪"],c:1}
],

4:[
{q:"昆虫の羽は多くの場合何枚？",a:["2枚","4枚","6枚","8枚"],c:1},
{q:"セミの幼虫の生活場所は？",a:["水中","土中","空中","花"],c:1},
{q:"昆虫の呼吸器官は？",a:["肺","気門","腸","皮膚"],c:1},
{q:"カマキリの特徴は？",a:["草食","捕食性","水生","寄生"],c:1},
{q:"昆虫の分類は？",a:["節足動物","軟体動物","脊椎動物","環形動物"],c:0}
]

};

let level = 5;
let questions = [];
let current = 0;
let userAnswers = [];
let endTime;
let timer;

function startExam(lv){

console.log("startExam called:", lv); // デバッグ用

level = lv;
questions = [...questionBank[lv]];

if(!questions || questions.length === 0){
    alert("この級の問題が設定されていません");
    return;
}

questions.sort(()=>Math.random()-0.5);

current = 0;
userAnswers = [];

document.getElementById("selectArea").style.display="none";
document.getElementById("quizArea").style.display="block";

endTime = Date.now() + 180000;

updateTimer();
timer = setInterval(updateTimer,200);

showQuestion();

}

function updateTimer(){

let remaining = Math.max(0, Math.floor((endTime - Date.now()) / 1000));

document.getElementById("timer").innerText =
"残り時間: " + remaining;

if(remaining <= 0){
    finishExam();
}

}

function showQuestion(){

if(current >= questions.length){
    finishExam();
    return;
}

let q = questions[current];

document.getElementById("progress").innerText =
(current+1) + "/" + questions.length;

document.getElementById("question").innerText = q.q;

let area = document.getElementById("choices");
area.innerHTML = "";

q.a.forEach((t,i)=>{

let b = document.createElement("button");
b.className = "choice";
b.innerText = t;

b.onclick = ()=>{

userAnswers[current] = i;
current++;
showQuestion();

};

area.appendChild(b);

});

}

function backQuestion(){

if(current > 0){
    current--;
    showQuestion();
}

}

function finishExam(){

clearInterval(timer);

let correct = 0;

for(let i=0;i<questions.length;i++){
if(userAnswers[i] === questions[i].c){
correct++;
}
}

document.getElementById("quizArea").style.display="none";
document.getElementById("resultArea").style.display="block";

let passLine = (level === 1) ? 5 : 3;
let pass = correct >= passLine;

document.getElementById("resultText").innerText =
pass ? "合格" : "不合格";

document.getElementById("detailText").innerText =
"正答数: " + correct + "/" + questions.length;

let used = Math.floor((180000 - (endTime - Date.now())) / 1000);

document.getElementById("timeText").innerText =
"経過時間: " + used + "秒";

}

</script>

</body>
</html>
