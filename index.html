<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆虫新聞 昆虫知識検定</title>

<style>

/* ===== 全体 ===== */
body{
    margin:0;
    background:linear-gradient(180deg,#edf7e8,#ffffff);
    font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
    color:#222;
    user-select:none;
}

/* 全要素明朝統一 */
*{
    font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
}

/* ヘッダー */
header{
    background:#2f5e2f;
    color:#fff;
    text-align:center;
    padding:30px;
}

/* レイアウト */
.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

/* カード */
.card{
    background:#fff;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

/* ボタン */
button{
    background:#2f5e2f;
    color:#fff;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
}

/* 選択肢 */
.choice{
    display:block;
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#edf5ea;
    border:1px solid #cfd8cf;
    border-radius:6px;
    text-align:left;
}

.choice:hover{
    background:#dfeeda;
}

/* 非表示 */
#quizArea,#resultArea{display:none;}

/* 注意事項 */
.notice{
    font-size:0.9rem;
    border-left:4px solid #2f5e2f;
    padding-left:10px;
    line-height:1.8;
}

/* タイマー */
#timer{
    font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>昆虫新聞 昆虫知識検定</h1>
</header>

<div class="container">

<!-- ================= 級選択 ================= -->
<div class="card" id="startArea">

<h2>受検級を選択してください</h2>

<button onclick="startExam(5)">5級</button>
<button onclick="startExam(4)">4級</button>
<button onclick="startExam(3)">3級</button>
<button onclick="startExam(2)">2級</button>
<button onclick="startExam(1)">1級</button>

<div class="notice">
  <br>
【注意事項】<br>
・外部検索や認証番号の譲渡・共有、試験内容の転載等の不正行為は禁止<br>
・合格資格の有効期間は6ヶ月
</div>

</div>

<!-- ================= 問題画面 ================= -->
<div class="card" id="quizArea">

<div style="display:flex;justify-content:space-between;">
<div id="progress"></div>
<div id="timer">180</div>
</div>

<hr>

<h2 id="question"></h2>
<div id="choices"></div>

<button onclick="goBack()">戻る</button>

</div>

<!-- ================= 結果 ================= -->
<div class="card" id="resultArea">

<h2>試験結果</h2>

<h1 id="scoreText"></h1>

<div id="rankText"></div>
<p id="commentText"></p>

<hr>

<h3>認証番号</h3>
<p id="cert"></p>

</div>

</div>

<script>

/* ================= 問題データ ================= */
const questions = {
5:[
{q:"昆虫の足の数は？",a:["4","6","8","10"],c:1},
{q:"昆虫の呼吸器官は？",a:["肺","気管","えら","皮膚"],c:1},
{q:"昆虫の体は何部構造？",a:["2","3","4","5"],c:1}
],
4:[
{q:"完全変態は？",a:["卵→幼虫→蛹→成虫","卵→成虫","蛹なし","幼虫なし"],c:0},
{q:"昆虫の外骨格は？",a:["保護","消化","呼吸","視覚"],c:0}
],
3:[
{q:"マメコガネ学名は？",a:["Popillia japonica","Anomala","Gryllus","Oxya"],c:0},
{q:"昆虫の分類は？",a:["節足動物","魚類","鳥類","哺乳類"],c:0}
],
2:[
{q:"ヤマトアオドウガネ属は？",a:["Anomala","Popillia","Goliathus","Trypoxylus"],c:0}
],
1:[
{q:"昆虫は？",a:["節足動物","魚類","鳥類","哺乳類"],c:0}
]
};

/* ================= 状態 ================= */
let level=5;
let list=[];
let i=0;
let score=0;
let timer;

/* ================= GAS URL ================= */
const GAS_URL="https://script.google.com/macros/s/AKfycbxxm4xXdd_mLEATiIC4PgxM_NHwNQCB7Cjef0NYbsukulVUaZQMgqLLObemseIh/exec";

/* ================= 認証番号 ================= */
function makeCode(){
const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
let b="";
for(let i=0;i<6;i++){
b+=c[Math.floor(Math.random()*c.length)];
}
return "KS-"+b;
}

/* ================= 開始 ================= */
function startExam(l){
level=l;
list=questions[level].sort(()=>Math.random()-0.5);

document.getElementById("startArea").style.display="none";
document.getElementById("quizArea").style.display="block";

i=0;
score=0;
time=180;

show();

timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText=time;
if(time<=0) finish();
},1000);
}

/* ================= 問題表示 ================= */
function show(){

if(i>=list.length){
finish();
return;
}

let q=list[i];

document.getElementById("progress").innerText=
(i+1)+"/"+list.length;

document.getElementById("question").innerText=q.q;

let c=document.getElementById("choices");
c.innerHTML="";

q.a.forEach((v,idx)=>{
let b=document.createElement("button");
b.className="choice";
b.innerText=v;
b.onclick=()=>{
if(idx===q.c)score++;
i++;
show();
};
c.appendChild(b);
});
}

/* ================= 戻る ================= */
function goBack(){
if(i>0){
i--;
show();
}
}

/* ================= 終了 ================= */
function finish(){

clearInterval(timer);

let percent=Math.round(score/list.length*100);

document.getElementById("quizArea").style.display="none";
document.getElementById("resultArea").style.display="block";

let rank="不合格";
let comment="再受検してください";

if(percent>=80){
rank="合格";
comment="基準を満たしています";
}

document.getElementById("scoreText").innerText=percent+"点";
document.getElementById("rankText").innerText=rank;
document.getElementById("commentText").innerText=comment;

let code=makeCode();
document.getElementById("cert").innerText=code;

/* ================= GAS送信 ================= */
fetch(GAS_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
code:code,
level:level,
score:percent,
result:rank,
date:new Date().toISOString()
})
});

}

</script>

</body>
</html>
