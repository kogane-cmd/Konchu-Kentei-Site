<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆虫新聞 昆虫知識検定</title>

<style>

body{
    margin:0;
    padding:0;
    background:#ffffff;
    color:#111;
    font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "MS PMincho",
    serif;
    user-select:none;
}

header{
    background:#1f3a1f;
    color:#fff;
    padding:25px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:2rem;
}

.container{
    max-width:850px;
    margin:auto;
    padding:20px;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    padding:20px;
    margin-bottom:15px;
}

button{
    background:#1f3a1f;
    color:#fff;
    border:none;
    padding:10px 15px;
    cursor:pointer;
    font-size:1rem;
    border-radius:6px;
}

button:hover{
    opacity:0.9;
}

.choice{
    display:block;
    width:100%;
    text-align:left;
    margin:8px 0;
    padding:10px;
    background:#f5f5f5;
    border:1px solid #ddd;
    cursor:pointer;
}

.choice:hover{
    background:#eaeaea;
}

#quizArea,
#resultArea{
    display:none;
}

#timer{
    font-weight:bold;
}

.small{
    font-size:0.9rem;
    color:#444;
}

footer{
    text-align:center;
    padding:20px;
    color:#666;
    font-size:0.9rem;
}

</style>
</head>

<body
oncontextmenu="return false;"
oncopy="return false;"
oncut="return false;"
onpaste="return false;"
>

<header>
    <h1>昆虫知識検定</h1>
</header>

<div class="container">

<div class="card" id="startArea">

    <h2>受験案内</h2>

    <p>
        ・全5問<br>
        ・制限時間180秒<br>
        ・外部検索は禁止<br>
        ・不正行為は禁止
    </p>

    <button onclick="startQuiz()">開始</button>

</div>

<div class="card" id="quizArea">

    <div style="display:flex;justify-content:space-between;">
        <div id="progress"></div>
        <div id="timer">180</div>
    </div>

    <hr>

    <h2 id="question"></h2>
    <div id="choices"></div>

</div>

<div class="card" id="resultArea">

    <h2>結果</h2>

    <h1 id="scoreText"></h1>

    <p id="rankText"></p>

    <p id="commentText"></p>

    <hr>

    <h3>認定番号</h3>
    <p id="certificate"></p>

    <button onclick="location.reload()">終了</button>

</div>

</div>

<footer>
昆虫新聞
</footer>

<script>

const questions = [

{
q:"カブトムシが主に食べるものはどれか。",
a:["樹液","草","花粉","水"],
correct:0
},

{
q:"昆虫の体の構造はどれか。",
a:["頭・胸・腹","頭・胴・脚","頭・腹・殻","胸・腹・羽"],
correct:0
},

{
q:"チョウの幼虫の名称はどれか。",
a:["イモムシ","ミミズ","ヤゴ","サナギ"],
correct:0
},

{
q:"昆虫の脚の本数は何本か。",
a:["4本","6本","8本","10本"],
correct:1
},

{
q:"バッタが多く見られる時期はどれか。",
a:["冬","春から秋","真冬","降雪時"],
correct:1
}

];

questions.sort(()=>Math.random()-0.5);

let current = 0;
let userAnswers = [];
let endTime;
let timer;

function startQuiz(){

    document.getElementById("startArea").style.display="none";
    document.getElementById("quizArea").style.display="block";

    endTime = Date.now() + 180000;

    showQuestion();

    timer = setInterval(()=>{

        let remaining = Math.max(
            0,
            Math.floor((endTime - Date.now()) / 1000)
        );

        document.getElementById("timer").innerText = remaining;

        if(remaining <= 0){
            finishQuiz();
        }

    },200);

}

function showQuestion(){

    if(current >= questions.length){
        finishQuiz();
        return;
    }

    const q = questions[current];

    document.getElementById("progress").innerText =
    (current+1) + "/" + questions.length;

    document.getElementById("question").innerText = q.q;

    const choices = document.getElementById("choices");
    choices.innerHTML = "";

    q.a.forEach((c,i)=>{

        const btn = document.createElement("button");
        btn.className = "choice";
        btn.innerText = c;

        btn.onclick = ()=>{

            userAnswers[current] = i;
            current++;
            showQuestion();

        };

        choices.appendChild(btn);

    });

}

function finishQuiz(){

    clearInterval(timer);

    let score = 0;

    for(let i=0;i<questions.length;i++){
        if(userAnswers[i] === questions[i].correct){
            score++;
        }
    }

    const percent = Math.round((score/questions.length)*100);

    document.getElementById("quizArea").style.display="none";
    document.getElementById("resultArea").style.display="block";

    document.getElementById("scoreText").innerText =
    percent + "点";

    let rank = "";
    let comment = "";

    if(percent === 100){
        rank = "1級";
        comment = "全問正答。基準を満たしています。";
    }
    else if(percent >= 90){
        rank = "2級";
        comment = "上位水準です。";
    }
    else if(percent >= 70){
        rank = "3級";
        comment = "標準的な水準です。";
    }
    else if(percent >= 50){
        rank = "4級";
        comment = "基礎は一部理解されています。";
    }
    else{
        rank = "5級";
        comment = "基礎が不足しています。";
    }

    document.getElementById("rankText").innerText = rank;
    document.getElementById("commentText").innerText = comment;

    document.getElementById("certificate").innerText =
    "KS-" + Date.now();

}

</script>

</body>
</html>
