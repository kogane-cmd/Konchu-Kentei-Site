<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆虫新聞 昆虫知識検定</title>

<style>
body{
    margin:0;
    background:linear-gradient(180deg,#edf7e8,#ffffff);
    font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif;
    color:#222;
}

header{
    background:#2f5e2f;
    color:white;
    text-align:center;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
    margin-bottom:20px;
}

button{
    background:#2f5e2f;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
}

.choice{
    display:block;
    width:100%;
    margin-top:10px;
    padding:12px;
    background:#f4f8f2;
    border:1px solid #cfd8cf;
    border-radius:6px;
    text-align:left;
}

#quizArea,#resultArea{display:none;}

.notice{
    font-size:0.9rem;
    border-left:4px solid #2f5e2f;
    padding-left:10px;
    line-height:1.8;
}
</style>
</head>

<body>

<header>
<h1>昆虫新聞 昆虫知識検定</h1>
</header>

<div class="container">

<div class="card" id="startArea">
<h2>受検開始</h2>

<button onclick="start()">開始</button>

<div class="notice">
・外部検索禁止<br>
・不正共有禁止<br>
・資格有効期間6ヶ月
</div>
</div>

<div class="card" id="quizArea">
<div id="progress"></div>
<h2 id="q"></h2>
<div id="choices"></div>
<button onclick="back()">戻る</button>
</div>

<div class="card" id="resultArea">
<h2>結果</h2>
<h1 id="score"></h1>
<div id="rank"></div>
<p id="comment"></p>
<p id="code"></p>
</div>

</div>

<script>

const GAS_URL = "https://script.google.com/macros/s/AKfycbxxm4xXdd_mLEATiIC4PgxM_NHwNQCB7Cjef0NYbsukulVUaZQMgqLLObemseIh/exec";

const questions = [
{q:"昆虫の足の本数",a:["6本","4本","8本","10本"],c:0},
{q:"昆虫の体構造",a:["頭胸腹","頭のみ","胴体のみ","頭脚腹"],c:0},
{q:"外骨格の主成分",a:["キチン","カルシウム","タンパク質","糖"],c:0},
{q:"昆虫の分類",a:["節足動物","魚類","鳥類","爬虫類"],c:0},
{q:"昆虫の呼吸",a:["気管","肺","えら","皮膚"],c:0}
];

let i=0;
let score=0;
let answers=[];

let startTime;

function start(){
document.getElementById("startArea").style.display="none";
document.getElementById("quizArea").style.display="block";
startTime=Date.now();
show();
}

function show(){

if(i>=questions.length){
finish();
return;
}

const q=questions[i];
document.getElementById("progress").innerText=(i+1)+"/"+questions.length;
document.getElementById("q").innerText=q.q;

const c=document.getElementById("choices");
c.innerHTML="";

q.a.forEach((v,idx)=>{
const b=document.createElement("button");
b.className="choice";
b.innerText=v;
b.onclick=()=>{
answers[i]=idx;
i++;
show();
};
c.appendChild(b);
});
}

function back(){
if(i>0){
i--;
show();
}
}

function finish(){

for(let j=0;j<questions.length;j++){
if(answers[j]===questions[j].c)score++;
}

let percent=Math.round(score/questions.length*100);

let rank="不合格";
if(percent>=80)rank="合格";

document.getElementById("quizArea").style.display="none";
document.getElementById("resultArea").style.display="block";

document.getElementById("score").innerText=percent+"点";
document.getElementById("rank").innerText=rank;

let code="KS-"+Math.random().toString(36).substring(2,8).toUpperCase();
document.getElementById("code").innerText=code;

/* ★重要：GAS送信（NO POST DATA対策済み） */
fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({
code:code,
level:1,
score:percent,
result:rank,
date:new Date().toISOString()
})
});

}

</script>

</body>
</html>
