<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆虫新聞 昆虫知識検定</title>

<style>

/* ★全体フォント固定（絶対維持） */
*{
    font-family:"Hiragino Mincho ProN","Yu Mincho","MS PMincho",serif !important;
}

body{
    margin:0;
    background:linear-gradient(180deg,#edf7e8,#ffffff);
    color:#222;
}

/* ヘッダー */
header{
    background:#2f5e2f;
    color:white;
    text-align:center;
    padding:28px;
}

header h1{
    margin:0;
    font-size:2rem;
}

/* コンテナ */
.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

/* カード */
.card{
    background:white;
    padding:25px;
    border-radius:16px;
    margin-bottom:20px;
    box-shadow:0 4px 16px rgba(0,0,0,0.08);
}

/* ボタン（共通） */
button{
    background:#2f5e2f;
    color:white;
    border:none;
    padding:12px 16px;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    margin-top:10px;
}

/* 選択肢ボタン */
.choice{
    display:block;
    width:100%;
    text-align:left;
    background:#f3f7f1;
    color:#222;
    border:1px solid #cfd8cf;
    margin-top:8px;
}

.choice:hover{
    background:#e6efe2;
}

/* 非表示エリア */
#quizArea,#resultArea{display:none;}

/* 注意事項 */
.notice{
    margin-top:10px;
    font-size:0.9rem;
    line-height:1.8;
    border-left:4px solid #2f5e2f;
    padding-left:10px;
}

/* タイマー */
#timer{
    font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>昆虫新聞 昆虫知識検定</h1>
</header>

<div class="container">

<!-- ★開始画面（完全版） -->
<div class="card" id="startArea">

<h2>試験概要</h2>

<p>受検する級を選択してください。</p>

<button onclick="start(5)">5級</button>
<button onclick="start(4)">4級</button>
<button onclick="start(3)">3級</button>
<button onclick="start(2)">2級</button>
<button onclick="start(1)">1級</button>

<div class="notice">
・外部検索や不正行為は禁止。<br>
・本人以外の代理受検は禁止。<br>
・試験時間は180秒。<br>
・全問題は選択式。<br>
・合格資格の有効期間は6ヶ月。<br>
</div>

</div>

<!-- ★問題画面 -->
<div class="card" id="quizArea">

<div style="display:flex;justify-content:space-between;">
<div id="progress"></div>
<div id="timer">180</div>
</div>

<hr>

<h2 id="question"></h2>

<div id="choices"></div>

<button onclick="back()">戻る</button>

</div>

<!-- ★結果画面 -->
<div class="card" id="resultArea">

<h2>試験結果</h2>

<h1 id="scoreText"></h1>

<div id="rankText"></div>

<p id="commentText"></p>

<hr>

<h3>認証コード</h3>
<p id="codeText"></p>

</div>

</div>

<script>

/* ★GAS URL（固定） */
const GAS_URL="https://script.google.com/macros/s/AKfycbzHzS5MBedGsL3HXRpoeNewb8GKklGE7lgdj3dry9QeCImK1zZmqCgHIvc_5Cb4m_nC/exec";

/* ★問題（完全版） */
const questions={
5:[
{q:"昆虫の足の本数は。",a:["6本","4本","8本","10本"],c:0},
{q:"昆虫の体は頭胸腹の3部構造である。",a:["正しい","誤り","一部正しい","わからない"],c:0},
{q:"外骨格の主成分は。",a:["キチン","カルシウム","鉄","脂質"],c:0},
{q:"昆虫は節足動物である。",a:["正しい","誤り","一部正しい","不明"],c:0},
{q:"昆虫の呼吸方法は。",a:["気管","肺","えら","皮膚"],c:0}
],
4:[
{q:"完全変態の順序は。",a:["卵幼虫蛹成虫","卵成虫","幼虫成虫蛹","卵蛹成虫"],c:0},
{q:"昆虫の翅の位置は。",a:["胸部","頭部","腹部","脚"],c:0},
{q:"昆虫の心臓の位置は。",a:["背側","腹側","頭部","脚"],c:0},
{q:"昆虫の目は。",a:["複眼","単眼のみ","虹彩","網膜"],c:0},
{q:"昆虫の体液の役割は。",a:["栄養運搬","骨形成","呼吸","光合成"],c:0}
],
3:[
{q:"マメコガネの学名は。",a:["Popillia japonica","Anomala albopilosa","Gryllus bimaculatus","Oxya yezoensis"],c:0},
{q:"昆虫の血液の色は。",a:["無色〜緑系","赤","青","黒"],c:0},
{q:"昆虫の神経系は。",a:["腹側神経索","背側神経索","脊髄","神経なし"],c:0},
{q:"昆虫の翅は基本何対か。",a:["二対","一対","三対","四対"],c:0},
{q:"昆虫の成長は。",a:["脱皮","分裂","発芽","光合成"],c:0}
],
2:[
{q:"ヤマトアオドウガネの属は。",a:["Anomala","Popillia","Trypoxylus","Goliathus"],c:0},
{q:"コガネムシの活動時期は。",a:["夏","冬","秋","春"],c:0},
{q:"昆虫に含まれないものは。",a:["種子","蛹","幼虫","卵"],c:0},
{q:"昆虫の脚の付け根は。",a:["基節","胸節","腹節","頭節"],c:0},
{q:"昆虫の感覚器でないものは。",a:["肺","触角","複眼","感覚毛"],c:0}
],
1:[
{q:"昆虫の分類は。",a:["節足動物","魚類","鳥類","哺乳類"],c:0},
{q:"昆虫の足の本数は。",a:["6本","4本","8本","10本"],c:0},
{q:"昆虫の体構造は。",a:["頭胸腹","頭のみ","胴体のみ","頭脚腹"],c:0},
{q:"昆虫に骨はあるか。",a:["ない外骨格","ある","一部ある","種類による"],c:0},
{q:"昆虫の目は。",a:["複眼","単眼のみ","なし","耳"],c:0}
]
};

let level=5;
let list=[];
let i=0;
let answers=[];
let timer;
let endTime;

/* ★開始 */
function start(l){

level=l;
list=questions[level];

i=0;
answers=[];

document.getElementById("startArea").style.display="none";
document.getElementById("quizArea").style.display="block";

endTime=Date.now()+180000;

timer=setInterval(()=>{
let t=Math.max(0,Math.floor((endTime-Date.now())/1000));
document.getElementById("timer").innerText=t;
if(t<=0)finish();
},200);

show();
}

/* ★表示 */
function show(){

if(i>=list.length){
finish();
return;
}

let q=list[i];

document.getElementById("progress").innerText=(i+1)+"/"+list.length;
document.getElementById("question").innerText=q.q;

let c=document.getElementById("choices");
c.innerHTML="";

q.a.forEach((v,idx)=>{
let b=document.createElement("button");
b.className="choice";
b.innerText=v;
b.onclick=()=>{
answers[i]=idx;
i++;
show();
};
c.appendChild(b);
});
}

/* ★戻る */
function back(){
if(i>0){
i--;
show();
}
}

/* ★終了 */
function finish(){

clearInterval(timer);

let score=0;

for(let j=0;j<list.length;j++){
if(answers[j]===list[j].c)score++;
}

let percent=Math.round(score/list.length*100);

let rank="不合格";
let comment="再受検してください";

if(percent>=80){
rank="合格";
comment="基準を満たしています";
}

document.getElementById("quizArea").style.display="none";
document.getElementById("resultArea").style.display="block";

document.getElementById("scoreText").innerText=percent+"点";
document.getElementById("rankText").innerText=rank;
document.getElementById("commentText").innerText=comment;

/* ★認証コード */
let code="KS-"+Math.random().toString(36).substring(2,8).toUpperCase();
document.getElementById("codeText").innerText=code;

/* ★GAS送信（完全版） */
fetch(GAS_URL,{
method:"POST",
body:JSON.stringify({
code:code,
level:level,
score:percent,
result:rank,
date:new Date().toISOString()
})
});

}

</script>

</body>
</html>
