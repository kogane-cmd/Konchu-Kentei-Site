<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆虫新聞 昆虫知識検定</title>

<style>

body{
    margin:0;
    padding:0;
    background:linear-gradient(180deg,#edf7e8,#ffffff);
    color:#222;

    font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "MS PMincho",
    serif;

    user-select:none;
    -webkit-user-select:none;
    -ms-user-select:none;
}

header{
    background:#2f5e2f;
    color:white;
    padding:30px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:2.2rem;
}

header p{
    margin-top:10px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

button{
    background:#2f5e2f;
    color:white;
    border:none;
    border-radius:10px;
    padding:12px 18px;
    cursor:pointer;
    font-size:1rem;
    margin-top:10px;
}

button:hover{
    opacity:0.9;
}

.choice{
    display:block;
    width:100%;
    text-align:left;
    background:#edf5ea;
    color:#222;
}

.choice:hover{
    background:#dfeeda;
}

#quizArea,
#resultArea{
    display:none;
}

#timer{
    font-weight:bold;
}

.badge{
    display:inline-block;
    background:#dff0d8;
    padding:10px 16px;
    border-radius:999px;
    margin-top:10px;
    font-weight:bold;
}

.small{
    font-size:0.9rem;
    color:#666;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}

</style>
</head>

<body
oncontextmenu="return false;"
oncopy="return false;"
oncut="return false;"
onpaste="return false;"
>

<header>
    <h1>昆虫新聞 昆虫知識検定</h1>
    <p>昆虫に関する知識や理解度を確認できます。</p>
</header>

<div class="container">

<div class="card" id="startArea">

    <h2>試験について</h2>

    <p>
        ・問題はランダムで出題されます<br>
        ・制限時間があります<br>
        ・検索や不正行為は禁止です<br>
        ・本試験は知識向上を目的としています
    </p>

    <button onclick="startQuiz()">試験開始</button>

</div>

<div class="card" id="quizArea">

    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">

        <div id="progress"></div>

        <div id="timer">
            残り時間: 180
        </div>

    </div>

    <hr>

    <h2 id="question"></h2>

    <div id="choices"></div>

    <div style="margin-top:20px;">

        <button onclick="goBack()">
            前の問題へ戻る
        </button>

    </div>

</div>

<div class="card" id="resultArea">

    <h2>試験結果</h2>

    <h1 id="scoreText"></h1>

    <div class="badge" id="rankText"></div>

    <p id="commentText"></p>

    <hr>

    <h3>認定証コード</h3>

    <p class="small">
        ※認定証確認や合格記録に使用できます
    </p>

    <p id="certificate"></p>

    <button onclick="location.reload()">
        トップへ戻る
    </button>

</div>

</div>

<footer>
昆虫新聞 - Konchu Shinbun
</footer>

<script>

const questions = [

{
q:"ヤマトアオドウガネの属として正しいものは？",
a:["Anomala","Popillia","Trypoxylus","Prosopocoilus"],
correct:0
},

{
q:"コガネムシの活動が活発になりやすい時期は？",
a:["真冬","梅雨〜夏","秋の終わり","雪の日"],
correct:1
},

{
q:"バッタ飼育で特に注意が必要なことは？",
a:["湿気過多","完全乾燥","冷凍保存","砂糖水のみ"],
correct:0
},

{
q:"マメコガネの学名として正しいものは？",
a:["Anomala daimiana","Popillia japonica","Allomyrina dichotoma","Oxya yezoensis"],
correct:1
},

{
q:"昆虫館の展示として適切なのは？",
a:["長期間掃除しない","生体に強い直射日光","安全と衛生を保つ","常に大音量"],
correct:2
}

];

questions.sort(()=>Math.random()-0.5);

let current = 0;
let score = 0;
let time = 180;
let timer;

let userAnswers = [];

function startQuiz(){

    document.getElementById("startArea").style.display="none";
    document.getElementById("quizArea").style.display="block";
    endTime = Date.now() + 180000;
    
    showQuestion();

    timer = setInterval(()=>{

    let remaining =
    Math.max(
        0,
        Math.floor((endTime - Date.now()) / 1000)
    );

    document.getElementById("timer").innerText =
    "残り時間: " + remaining;

    if(remaining <= 0){
        finishQuiz();
    }

},200);

function showQuestion(){

    if(current >= questions.length){
        finishQuiz();
        return;
    }

    const q = questions[current];

    document.getElementById("progress").innerText =
    `問題 ${current+1} / ${questions.length}`;

    document.getElementById("question").innerText =
    q.q;

    const choices =
    document.getElementById("choices");

    choices.innerHTML = "";

    q.a.forEach((choice,index)=>{

        const btn =
        document.createElement("button");

        btn.className = "choice";

        btn.innerText = choice;

        btn.onclick = ()=>{

            userAnswers[current] = index;

            current++;

            showQuestion();

        };

        choices.appendChild(btn);

    });

}

function goBack(){

    if(current > 0){

        current--;

        showQuestion();

    }

}

function finishQuiz(){

    clearInterval(timer);

    score = 0;

    for(let i=0;i<questions.length;i++){

        if(userAnswers[i] === questions[i].correct){
            score++;
        }

    }

    document.getElementById("quizArea").style.display="none";

    document.getElementById("resultArea").style.display="block";

    const percent =
    Math.round((score/questions.length)*100);

    document.getElementById("scoreText").innerText =
    percent + "点";

    let rank = "見習い研究員";
    let comment = "今後の知識向上に期待します。";

    if(percent >= 80){
        rank = "昆虫研究員";
        comment = "高い昆虫知識が確認されました。";
    }

    if(percent === 100){
        rank = "特級昆虫研究員";
        comment = "極めて高い昆虫知識が確認されました。";
    }

    document.getElementById("rankText").innerText =
    rank;

    document.getElementById("commentText").innerText =
    comment;

    const code =
    "KS-" + Math.floor(Math.random()*999999);

    document.getElementById("certificate").innerText =
    code;

}

</script>

</body>
</html>
