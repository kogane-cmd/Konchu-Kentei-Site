<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昆虫新聞 昆虫知識検定</title>

<style>

body{
    margin:0;
    padding:0;
    background:linear-gradient(180deg,#edf7e8,#ffffff);
    color:#222;

    font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "MS PMincho",
    serif;

    user-select:none;
}

*{
    font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "MS PMincho",
    serif;
}

/* ヘッダー */
header{
    background:#2f5e2f;
    color:white;
    padding:30px;
    text-align:center;
}

/* コンテナ */
.container{
    max-width:900px;
    margin:auto;
    padding:25px;
}

/* カード */
.card{
    background:white;
    border-radius:18px;
    padding:25px;
    margin-bottom:20px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

/* ボタン */
button{
    background:#2f5e2f;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    font-size:1rem;
    margin-top:10px;
    font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "MS PMincho",
    serif;
}

/* 選択肢 */
.choice{
    display:block;
    width:100%;
    text-align:left;
    background:#edf5ea;
    color:#111;
    margin-top:10px;
    padding:12px;
    border-radius:6px;
    border:1px solid #cfd8cf;
}

.choice:hover{
    background:#dfeeda;
}

/* 注意事項 */
.notice{
    font-size:0.9rem;
    color:#444;
    line-height:1.8;
    border-left:4px solid #2f5e2f;
    padding-left:10px;
}

/* 非表示 */
#quizArea,#resultArea{display:none;}

/* タイマー */
#timer{font-weight:bold;}

.badge{
    display:inline-block;
    background:#dff0d8;
    padding:10px 16px;
    border-radius:999px;
    margin-top:10px;
    font-weight:bold;
}

</style>
</head>

<body>

<header>
<h1>昆虫新聞 昆虫知識検定</h1>
</header>

<div class="container">

<!-- 級選択 -->
<div class="card" id="startArea">

<h2>受検級の選択</h2>

<button onclick="selectLevel(5)">5級</button>
<button onclick="selectLevel(4)">4級</button>
<button onclick="selectLevel(3)">3級</button>
<button onclick="selectLevel(2)">2級</button>
<button onclick="selectLevel(1)">1級</button>

<div class="notice">
【注意事項】<br>
・外部検索等の不正行為は禁止<br>
・本人以外の代理受検は禁止<br>
・試験中のスクリーンショット共有は禁止<br>
・本検定の認証番号は6ヶ月間有効<br>
・受検者識別情報は2日間のみ保持される
</div>

</div>

<!-- 問題 -->
<div class="card" id="quizArea">

<div style="display:flex;justify-content:space-between;">
<div id="progress"></div>
<div id="timer">残り時間: 180</div>
</div>

<hr>

<h2 id="question"></h2>

<div id="choices"></div>

<button onclick="goBack()">前の問題へ戻る</button>

</div>

<!-- 結果 -->
<div class="card" id="resultArea">

<h2>試験結果</h2>

<h1 id="scoreText"></h1>

<div class="badge" id="rankText"></div>

<p id="commentText"></p>

<hr>

<h3>認証番号</h3>
<p id="certificate"></p>

<button onclick="location.reload()">トップへ戻る</button>

</div>

</div>

<script>

// 問題（省略せずそのまま）
const questionBank = {
5:[
{q:"昆虫の体は？",a:["2部","3部","4部","5部"],c:1},
{q:"昆虫の足の数は？",a:["4","6","8","10"],c:1},
{q:"呼吸器官は？",a:["肺","気管","えら","皮膚"],c:1},
{q:"カブトムシは主に？",a:["昼","夜","朝","常時"],c:1},
{q:"昆虫は？",a:["脊椎動物","無脊椎動物","魚類","鳥類"],c:1}
],
4:[
{q:"完全変態とは？",a:["卵→幼虫→蛹→成虫","卵→成虫","卵→幼虫→成虫","蛹なし"],c:0},
{q:"昆虫の外骨格は？",a:["保護","消化","呼吸","視覚"],c:0},
{q:"セミはどこで鳴く？",a:["木","土","水","空"],c:0},
{q:"昆虫の目は？",a:["単眼","複眼","なし","耳型"],c:1},
{q:"コガネムシは？",a:["甲虫","魚","鳥","爬虫類"],c:0}
],
3:[
{q:"マメコガネ学名は？",a:["Popillia japonica","Anomala","Oxya","Gryllus"],c:0},
{q:"昆虫の触角は？",a:["感覚器","飛行器","消化器","呼吸器"],c:0},
{q:"昆虫は？",a:["節足動物","軟体動物","魚類","哺乳類"],c:0},
{q:"幼虫は？",a:["成長段階","成虫","卵","蛹のみ"],c:0},
{q:"心臓は？",a:["腹部","頭部","脚","羽"],c:0}
],
2:[
{q:"ヤマトアオドウガネ属は？",a:["Anomala","Popillia","Trypoxylus","Goliathus"],c:0},
{q:"翅の数は？",a:["1対","2対","3対","4対"],c:1},
{q:"視覚器官は？",a:["目","耳","鼻","肺"],c:0},
{q:"寿命は？",a:["数日","数ヶ月","数年","10年"],c:1},
{q:"脚は？",a:["外骨格","内骨格","軟骨","筋肉"],c:0}
],
1:[
{q:"体の構成は？",a:["頭胸腹","頭脚羽","胸腹尾","頭尾脚"],c:0},
{q:"羽の役割は？",a:["移動","食事","呼吸","視覚"],c:0},
{q:"外骨格は？",a:["保護","消化","呼吸","視覚"],c:0},
{q:"分類は？",a:["節足動物","魚類","鳥類","軟体動物"],c:0},
{q:"幼虫は？",a:["成長段階","成虫","卵","蛹"],c:0}
]
};

// 状態
let level=5;
let questions=[];
let current=0;
let score=0;
let time=180;
let timer;

// 認証番号生成
const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

function randomString(len){
let r="";
for(let i=0;i<len;i++){
r+=chars[Math.floor(Math.random()*chars.length)];
}
return r;
}

function checkCode(b){
let s=0;
for(let i=0;i<b.length;i++){
s+=b.charCodeAt(i);
}
return chars[s%chars.length]+chars[(s*7)%chars.length];
}

function generateCode(){
let base=randomString(6);
return "KS-"+base+"-"+checkCode(base);
}

// 開始
function selectLevel(l){
level=l;
questions=questionBank[level].sort(()=>Math.random()-0.5);

document.getElementById("startArea").style.display="none";
document.getElementById("quizArea").style.display="block";

startQuiz();
}

function startQuiz(){
current=0;
score=0;
time=180;

showQuestion();

timer=setInterval(()=>{
time--;
document.getElementById("timer").innerText="残り時間: "+time;
if(time<=0) finishQuiz();
},1000);
}

// 問題
function showQuestion(){
if(current>=questions.length){
finishQuiz();
return;
}

let q=questions[current];

document.getElementById("progress").innerText=
`問題 ${current+1}/${questions.length}`;

document.getElementById("question").innerText=q.q;

let c=document.getElementById("choices");
c.innerHTML="";

q.a.forEach((v,i)=>{
let b=document.createElement("button");
b.className="choice";
b.innerText=v;
b.onclick=()=>{
if(i===q.c) score++;
current++;
showQuestion();
};
c.appendChild(b);
});
}

// 戻る
function goBack(){
if(current>0){
current--;
showQuestion();
}
}

// 結果
function finishQuiz(){
clearInterval(timer);

let percent=Math.round((score/questions.length)*100);

document.getElementById("quizArea").style.display="none";
document.getElementById("resultArea").style.display="block";

document.getElementById("scoreText").innerText=percent+"点";

let rank="不合格";
let comment="再受検してください";

if(percent>=80){
rank="合格";
comment="基準を満たしています";
}

document.getElementById("rankText").innerText=rank;
document.getElementById("commentText").innerText=comment;

document.getElementById("certificate").innerText=generateCode();
}

</script>

</body>
</html>
